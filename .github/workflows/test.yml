name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m ruff check pinpoint tests scripts
      - run: python -m ruff format --check pinpoint tests scripts
      - run: python -m compileall -q pinpoint scripts
      - run: python -m pinpoint.cli validate
