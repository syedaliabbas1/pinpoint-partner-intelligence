<form class="filters panel" method="get" action="/" novalidate>
<div class="search-field"><label for="query">Find a partner</label><div class="search-control"><input id="query" name="q" type="search" maxlength="200" value="{{ filters.q }}" placeholder="Name, practice or biography" autocomplete="off"><button type="button" id="clear-search" aria-label="Clear search" disabled {% if not filters.q %}hidden{% endif %}>×</button></div></div>
<div><label for="firm">Firm</label><select id="firm" name="firm"><option value="">All 15 firms</option>{% for id,f in firms.items() %}<option value="{{ id }}" {% if filters.firm == id %}selected{% endif %}>{{ f.name }}</option>{% endfor %}</select></div>
<div><label for="office">Office</label><select id="office" name="office"><option value="">All captured offices</option>{% for o in offices %}<option {% if filters.office == o %}selected{% endif %}>{{ o }}</option>{% endfor %}</select></div>
<div><label for="practice">Practice evidence</label><select id="practice" name="practice"><option value="">Corporate & M&A</option>{% for p in practices %}<option {% if filters.practice == p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
<button class="button primary" type="submit">Search</button>
</form>
